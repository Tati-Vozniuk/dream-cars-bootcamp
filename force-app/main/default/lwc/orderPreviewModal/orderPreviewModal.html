<template>
    <lightning-modal-header label="Order Preview"></lightning-modal-header>
    <lightning-modal-body>
        <iframe
            src={pdfUrl}
            width="100%"
            height="600px"
            style="border: none;">
        </iframe>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button
            label="Cancel"
            onclick={handleCancel}>
        </lightning-button>
        <lightning-button
            label="Create Order"
            variant="brand"
            onclick={handleCreateOrder}
            class="slds-m-left_x-small">
        </lightning-button>
    </lightning-modal-footer>
</template>
