<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Cars - schedule a car service appointment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #1a1a2e;
            font-size: 22px;
        }
        form {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 4px;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        input[type="submit"] {
            margin-top: 20px;
            background-color: #1a1a2e;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
        }
        input[type="submit"]:hover {
            background-color: #333355;
        }
        .required-note {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <h1>Dream Cars - schedule a car service appointment</h1>

    <form action="https://webto.salesforce.com/servlet/servlet.WebToCase?encoding=UTF-8&orgId=00Dfj00000XLJFx" method="POST">

        <input type="hidden" name="orgid" value="00Dfj00000XLJFx">
        <input type="hidden" name="retURL" value="https://www.google.com">

        <label for="name">Name *</label>
        <input id="name" maxlength="80" name="name" size="20" type="text" required>

        <label for="email">Email</label>
        <input id="email" maxlength="80" name="email" size="20" type="email">

        <label for="phone">Phone *</label>
        <input id="phone" maxlength="40" name="phone" size="20" type="text" required>

        <label for="00Nfj00004PM7K9">Car Brand *</label>
        <input id="00Nfj00004PM7K9" maxlength="255" name="00Nfj00004PM7K9" size="20" type="text" required>

        <label for="00Nfj00004PM8Uj">Car Model</label>
        <input id="00Nfj00004PM8Uj" maxlength="255" name="00Nfj00004PM8Uj" size="20" type="text">

        <label for="00Nfj00004PMC0T">Car Vin Code *</label>
        <input id="00Nfj00004PMC0T" maxlength="17" name="00Nfj00004PMC0T" size="20" type="text" required>

        <label for="subject">Reason *</label>
        <input id="subject" maxlength="80" name="subject" size="20" type="text" required>

        <label for="description">Description</label>
        <textarea name="description"></textarea>

        <input type="submit" name="submit" value="Submit Request">

    </form>

</body>
</html>
